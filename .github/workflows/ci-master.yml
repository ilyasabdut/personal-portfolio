name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    # runs-on: ubuntu-24.04-arm
    runs-on: self-hosted
    environment: master

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: registry.ilyasabdut.loseyourip.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push ARM Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: registry.ilyasabdut.loseyourip.com/personal-portfolio:latest

  deployment:
    needs: build
    runs-on: self-hosted
    environment: master
    steps:
      - name: Log in to Docker registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.ilyasabdut.loseyourip.com -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Pull and Restart Container
        run: |
          echo "Deploying on $(hostname)"
          cd /home/ubuntu/composes/portfolio

          echo "Pulling latest image..."
          docker compose pull

          echo "Restarting container..."
          docker compose down
          docker compose up -d

          echo "Deployment finished!"

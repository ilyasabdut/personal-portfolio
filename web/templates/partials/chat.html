<div x-data="chatStream()" class="chat-box">
  <div class="chat-header">
    <div class="header-title" @click="toggleChat">
      <h3 class="chat-title">Ask Me!</h3>
    </div>
    <div class="header-controls">
      <button @click.stop="clearChat" 
              class="chat-clear-btn" 
              :class="{ 'confirming': confirmingClear }"
              :title="confirmingClear ? 'Click again to confirm' : 'Clear Chat'">
        <template x-if="!confirmingClear">
          <span>🗑️</span>
        </template>
        <template x-if="confirmingClear">
          <span class="confirm-text">Clear?</span>
        </template>
      </button>
      <button @click="toggleChat" class="chat-toggle-btn" x-text="isExpanded ? '_' : '🗖'"></button>
    </div>
  </div>

  <div x-show="isExpanded" class="chat-body">
    <div id="messages" class="chat-messages" x-ref="messages">
      <template x-for="msg in messages" :key="msg.id">
        <div class="bubble" :class="msg.type" :id="'msg-' + msg.id">
          <template x-if="msg.content === 'typing...'">
            <div class="dot-typing">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </template>
          <template x-if="msg.content !== 'typing...'">
            <span x-html="msg.content"></span>
          </template>
        </div>
      </template>
    </div>

    <form @submit.prevent="sendMessage" class="chat-form">
      <div class="chat-input-wrapper">
        <input x-model="input" type="text" placeholder="Type your message..." required class="chat-input" />
        <button type="submit" class="chat-send-btn" aria-label="Send">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  function chatStream() {
    return {
      input: '',
      messages: [],
      eventSource: null,
      sessionId: '',
      confirmingClear: false,
      isExpanded: true,
      clearTimeoutId: null,

      init() {
        this.sessionId = this.getCookie("session_id");
        this.loadSession();
      },

      getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return '';
      },

      loadSession() {
        const key = `chatMessages-${this.sessionId}`;
        const savedMessages = sessionStorage.getItem(key);

        if (savedMessages) {
          this.messages = JSON.parse(savedMessages);
          this.$nextTick(() => {
            this.$refs.messages.scrollTop = this.$refs.messages.scrollHeight;
          });
          return;
        }

        fetch("/session", { 
          credentials: "include",
          headers: { 'Cache-Control': 'no-cache' }
        })
        .then((res) => res.json())
        .then((data) => {
          if (data && data.session_id && Array.isArray(data.messages)) {
            this.messages = data.messages.map((msg, i) => {
              return {
                id: Date.now() + i,
                type: msg.role === "user" ? "user-bubble" : "llm-bubble",
                content: msg.content
              };
            });

            sessionStorage.setItem(key, JSON.stringify(this.messages));
            this.$nextTick(() => {
              this.$refs.messages.scrollTop = this.$refs.messages.scrollHeight;
            });
          }
        })
        .catch((err) => {
          console.error("Failed to load session:", err);
        });
      },

      clearChat() {
        if (!this.confirmingClear) {
          this.confirmingClear = true;
          if (this.clearTimeoutId) clearTimeout(this.clearTimeoutId);
          this.clearTimeoutId = setTimeout(() => {
            this.confirmingClear = false;
            this.clearTimeoutId = null;
          }, 3000);
          return;
        }

        if (this.clearTimeoutId) {
          clearTimeout(this.clearTimeoutId);
          this.clearTimeoutId = null;
        }

        fetch("/clear-chat", { method: "POST" })
          .then((res) => {
            if (res.ok) {
              this.messages = [];
              sessionStorage.removeItem(`chatMessages-${this.sessionId}`);
              this.confirmingClear = false;
              return res.json().catch(() => ({}));
            }
          })
          .then((data) => {
            if (data && data.new_session_id) {
              this.sessionId = data.new_session_id;
            }
          })
          .catch((err) => {
            console.error("Failed to clear chat:", err);
            this.confirmingClear = false;
          });
      },

      toggleChat() {
        this.isExpanded = !this.isExpanded;
      },

      decodeHTML(html) {
        const txt = document.createElement("textarea");
        txt.innerHTML = html;
        return txt.value;
      },

      sendMessage() {
        const msg = this.input.trim();
        if (!msg) return;

        const key = `chatMessages-${this.sessionId}`;
        this.input = '';
        const userId = Date.now();
        this.messages.push({ id: userId, type: 'user-bubble', content: msg });
        sessionStorage.setItem(key, JSON.stringify(this.messages));

        this.$nextTick(() => {
          this.$refs.messages.scrollTop = this.$refs.messages.scrollHeight;
        });

        const llmId = userId + 1;
        this.messages.push({ id: llmId, type: 'llm-bubble', content: 'typing...' });
        sessionStorage.setItem(key, JSON.stringify(this.messages));

        if (this.eventSource) {
          this.eventSource.close();
          this.eventSource = null;
        }

        const queryParams = new URLSearchParams({ message: msg }).toString();

        try {
          this.eventSource = new EventSource(`/chat?${queryParams}`, {
            withCredentials: true
          });

          let responseText = '';

          this.eventSource.onmessage = (event) => {
            const msgObj = this.messages.find(m => m.id === llmId);
            if (msgObj.content === 'typing...') {
              responseText = '';
              msgObj.content = '';
            }

            const decodedData = this.decodeHTML(event.data);
            responseText += decodedData;
            msgObj.content = responseText;

            sessionStorage.setItem(key, JSON.stringify(this.messages));
            this.$nextTick(() => {
              this.$refs.messages.scrollTop = this.$refs.messages.scrollHeight;
            });
          };

          this.eventSource.addEventListener('complete', () => {
            this.eventSource?.close();
            this.eventSource = null;
          });

          this.eventSource.onerror = (event) => {
            console.error("SSE connection error:", event);
            const msgObj = this.messages.find(m => m.id === llmId);
            if (msgObj && msgObj.content === 'typing...') {
              msgObj.content = "Network error. Try again.";
            }
            this.eventSource?.close();
            this.eventSource = null;
            sessionStorage.setItem(key, JSON.stringify(this.messages));
          };
        } catch (error) {
          console.error("Failed to create EventSource:", error);
          const msgObj = this.messages.find(m => m.id === llmId);
          if (msgObj) {
            msgObj.content = "Failed to connect to server.";
          }
          sessionStorage.setItem(key, JSON.stringify(this.messages));
        }
      }
    }
  }
</script>
